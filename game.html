<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <link rel="stylesheet" href="game.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <h1> Rock-Paper-Scissors GAME ✔ </h1>
    <div class="choicse">
        <div class="choice" id="rock">
            <img src="rock.png" > 
        </div>
        <div class="choice" id="paper">
            <img src="paper.png" alt="#">
        </div>
        <div class="choice" id="scissors">
            <img src="scissors.png" alt="#">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>
        <div class="score">
            <p id="pc-score">0</p>
            <p>PC</p>
        </div>

    </div>
    <div class="msg-cont">
        <p id="msg"> Play Your Move </p>

    </div>

    <script src="game.js"></script>
</body>
</html>
